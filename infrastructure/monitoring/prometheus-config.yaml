global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: healthos
    environment: production

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

rule_files:
- /etc/prometheus/rules/*.yml

scrape_configs:
- job_name: healthos-api
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - healthos
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_app]
    action: keep
    regex: healthos-api
  - source_labels: [__meta_kubernetes_pod_name]
    target_label: pod
  - source_labels: [__meta_kubernetes_namespace]
    target_label: namespace
  metrics_path: /metrics
  scrape_interval: 30s

- job_name: postgres
  static_configs:
  - targets: ['postgres-exporter:9187']
  relabel_configs:
  - source_labels: [__address__]
    target_label: instance

- job_name: redis
  static_configs:
  - targets: ['redis-exporter:9121']
  relabel_configs:
  - source_labels: [__address__]
    target_label: instance

- job_name: neo4j
  static_configs:
  - targets: ['neo4j:7687']
  relabel_configs:
  - source_labels: [__address__]
    target_label: instance
